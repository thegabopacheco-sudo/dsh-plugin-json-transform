# dsh-plugin-json-transform — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "jsontransform".
# Tools resultantes: mcp__jsontransform__* (ver README).
- insert:
    - id: mcp-json-transform
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jsontransform
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/json-transform/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
